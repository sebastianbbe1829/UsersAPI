<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #004080;
      color: #ffffff;
      padding: 25px;
      text-align: center;
    }

    .header img {
      width: 220px;
      height: auto;
      display: block;
      margin: 0 auto 15px auto;
      border: 0;
      outline: none;
      text-decoration: none;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      background-color: #ffffff;
      margin: 30px auto;
      padding: 30px 25px;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #004080;
      margin-top: 0;
      margin-bottom: 20px;
    }

    p {
      color: #333333;
      line-height: 1.6;
      font-size: 15px;
    }

    .button-container {
      text-align: center;
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      background-color: #007bff;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
    }

    .footer {
      text-align: center;
      font-size: 12px;
      color: #999999;
      margin: 30px auto 20px auto;
      max-width: 600px;
    }

    .footer p {
      color: #999999;
      font-size: 12px;
      margin: 0;
    }
  </style>
</head>

<body>

  <!-- ================================================== -->
  <!-- HEADER -->
  <!-- ================================================== -->

  <div class="header">

    <img
      src="{{ logo_url }}"
      alt="Gestión Usuarios SBB"
      width="220"
    >

    <h1>UsersAPI Notification</h1>

  </div>


  <!-- ================================================== -->
  <!-- CONTENIDO -->
  <!-- ================================================== -->

  <div class="container">

    <h2>{{ subject }}</h2>

    <p>
      {{ message }}
    </p>

    <div class="button-container">

      <a
        href="{{ activation_url }}"
        class="button"
        target="_blank"
      >
        Activar Cuenta
      </a>

    </div>

  </div>


  <!-- ================================================== -->
  <!-- FOOTER -->
  <!-- ================================================== -->

  <div class="footer">

    <p>
      Sent by {{ sender }} | UsersAPI
    </p>

  </div>

</body>
</html>
