name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/public-tenant-ui-config

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d users_api_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Prepare database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d users_api_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS users_api;

          DO $$
          BEGIN
              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'users_api_app'
              ) THEN
                  CREATE ROLE users_api_app
                  LOGIN
                  PASSWORD 'ci_users_api_app'
                  NOSUPERUSER
                  NOCREATEDB
                  NOCREATEROLE
                  NOINHERIT
                  NOBYPASSRLS;
              END IF;

              IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = 'users_api_bootstrap'
              ) THEN
                  CREATE ROLE users_api_bootstrap
                  LOGIN
                  PASSWORD 'ci_users_api_bootstrap'
                  NOSUPERUSER
                  NOCREATEDB
                  NOCREATEROLE
                  INHERIT
                  BYPASSRLS;
              END IF;
          END
          $$;

          GRANT USAGE ON SCHEMA users_api TO users_api_app;
          GRANT USAGE ON SCHEMA users_api TO users_api_bootstrap;
          SQL

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
        run: alembic upgrade head

      - name: Apply application database permissions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d users_api_ci -v ON_ERROR_STOP=1 <<'SQL'
          GRANT USAGE ON SCHEMA users_api TO users_api_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA users_api TO users_api_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA users_api TO users_api_app;

          GRANT USAGE ON SCHEMA users_api TO users_api_bootstrap;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA users_api TO users_api_bootstrap;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA users_api TO users_api_bootstrap;
          SQL

      - name: Seed test permissions
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
        run: python scripts/seed_permissions.py

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          APP_DATABASE_URL: postgresql+psycopg://users_api_app:ci_users_api_app@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_TENANT_KEY: test-bootstrap-tenant-key
          SECRET_KEY: ci-secret-key
          SUPER_SECRET_KEY: ci-super-secret-key
        run: pytest -q

      - name: Run security scan
        run: bandit -r UsersAPI -ll
