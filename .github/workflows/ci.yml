name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/public-tenant-ui-config

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run Ruff
        run: ruff check .

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-openpyxl types-passlib types-python-jose
      - name: Run Mypy
        run: mypy UsersAPI

  bandit:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run Bandit
        run: bandit -r UsersAPI -ll

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d users_api_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          SECRET_KEY: ci-secret-key
          SUPER_SECRET_KEY: ci-super-secret-key
        run: pytest -q
