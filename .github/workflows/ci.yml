name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: users_api_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d users_api_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: ruff check .

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Prepare database roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d users_api_ci \
            -v ON_ERROR_STOP=1 \
            -f scripts/database/ci/01_prepare_roles.sql

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
        run: alembic upgrade head

      - name: Validate database migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
        run: alembic check

      - name: Apply application database permissions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d users_api_ci \
            -v ON_ERROR_STOP=1 \
            -f scripts/database/ci/02_apply_permissions.sql

      - name: Seed test permissions
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          PYTHONPATH: .
        run: python scripts/seed_permissions.py

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          APP_DATABASE_URL: postgresql+psycopg://users_api_app:ci_users_api_app@localhost:5432/users_api_ci
          BOOTSTRAP_DATABASE_URL: postgresql+psycopg://users_api_bootstrap:ci_users_api_bootstrap@localhost:5432/users_api_ci
          DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/users_api_ci
          USERS_API_APP_PASSWORD: ci_users_api_app
          USERS_API_BOOTSTRAP_PASSWORD: ci_users_api_bootstrap
          BOOTSTRAP_TENANT_KEY: test-bootstrap-tenant-key
          SECRET_KEY: ci-secret-key
          SUPER_SECRET_KEY: ci-super-secret-key
        run: pytest -q --cov=UsersAPI --cov-report=term-missing --cov-fail-under=80

      - name: Run security scan
        run: bandit -r UsersAPI -l
