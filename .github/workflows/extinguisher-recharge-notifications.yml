name: Extinguisher Recharge Notifications

on:
  schedule:
    # Ejecutar fuera de los minutos 00/30 reduce el riesgo de retrasos por alta carga.
    # Python valida la hora configurada y solo envía cuando ya fue alcanzada.
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extinguisher recharge notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOOTSTRAP_DATABASE_URL: ${{ secrets.BOOTSTRAP_DATABASE_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          API_EMAIL_URL: ${{ secrets.API_EMAIL_URL }}
          EXTINGUISHER_RECHARGE_NOTIFICATIONS_ENABLED: ${{ vars.EXTINGUISHER_RECHARGE_NOTIFICATIONS_ENABLED }}
          EXTINGUISHER_RECHARGE_NOTIFICATION_TIME: ${{ vars.EXTINGUISHER_RECHARGE_NOTIFICATION_TIME }}
          JOB_TIMEZONE: ${{ vars.JOB_TIMEZONE }}
          PYTHONPATH: .
        run: python scripts/jobs/run_extinguisher_recharge_notifications.py
