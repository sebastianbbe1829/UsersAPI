[tool.ruff]
line-length = 100
exclude = [
  ".git",
  ".venv",
  "venv",
  "alembic/versions",
  "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = [
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"test/test_inventory_domain_unit.py" = ["E501", "F401"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
