[pytest]
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:.*Accessing argon2.__version__ is deprecated.*:DeprecationWarning
markers =
    unit: pruebas unitarias sin servicios externos
    integration: pruebas de integración con la aplicación y la base de datos
    rls: pruebas de aislamiento y políticas Row-Level Security
    security: pruebas de controles de seguridad
    super: pruebas del flujo de autenticación SUPER
